[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-domain-model"
version = "0.4.0"
description = "Laboratory work 4 (Professional Python): typed OOP model of a student records system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nazar Levandivskyi" }]

[project.optional-dependencies]
dev = ["mypy>=1.10", "ruff>=0.5", "pytest>=8"]

[project.scripts]
student-domain = "domain_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
domain_app = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
mypy_path = "src"
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"report/*" = ["E402", "E501"]
